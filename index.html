<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herr Hungers kleiner Helfer – dein Physik-Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#152e28; --bg-2:#102520; --panel:#1c3d34;
    --chalk:#f3efe3; --chalk-dim:#9db2a8;
    --yellow:#eab54c; --blue:#7fc4dc; --coral:#e2896a;
    --border:rgba(243,239,227,.14);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--chalk);
    font-family:'Inter',sans-serif; display:flex; flex-direction:column;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:4px 4px;
  }
  header{
    display:flex; align-items:center; gap:14px; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 4px;
    background:var(--bg-2); position:sticky; top:0; z-index:5;
  }
  h1{font-family:'Kalam',cursive; font-size:1.4rem; margin:0; font-weight:700; line-height:1.15; text-align:center}
  .sub{color:var(--chalk-dim); font-size:.82rem; margin-top:2px; text-align:center}
  .gear{position:absolute; right:14px; top:calc(env(safe-area-inset-top,0px) + 14px); background:none; border:1px solid var(--border); color:var(--chalk);
    width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:1.1rem; flex-shrink:0}
  .gear:hover{border-color:var(--yellow)}

  #avatarStage{
    position:relative; display:flex; justify-content:center; align-items:center;
    padding:4px 0 10px; background:var(--bg-2); border-bottom:1px dashed var(--border);
  }
  #avatar3d{ width:190px; height:190px; }

  #settings{
    background:var(--bg-2); border-bottom:1px dashed var(--border);
    padding:14px 18px; display:none; gap:10px; flex-wrap:wrap; align-items:center;
  }
  #settings.open{display:flex}
  #settings label{font-size:.85rem; color:var(--chalk-dim)}
  #settings input{
    flex:1; min-width:180px; background:var(--panel); border:1px solid var(--border);
    color:var(--chalk); padding:8px 10px; border-radius:6px; font-family:inherit; font-size:.9rem;
  }
  #settings button{
    background:var(--yellow); color:#17322b; border:none; padding:8px 14px;
    border-radius:6px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  #settingsHint{width:100%; font-size:.78rem; color:var(--chalk-dim); margin:0}

  nav{display:flex; gap:0; background:var(--bg-2); border-bottom:1px solid var(--border)}
  nav button{
    flex:1; background:none; border:none; color:var(--chalk-dim); font-family:'Kalam',cursive;
    font-size:1.05rem; padding:10px 4px 12px; cursor:pointer; border-bottom:3px solid transparent;
  }
  nav button.active{color:var(--chalk); border-bottom-color:var(--accent,var(--yellow))}
  nav button[data-tab="chat"].active{--accent:var(--yellow)}
  nav button[data-tab="diagram"].active{--accent:var(--blue)}
  nav button[data-tab="task"].active{--accent:var(--coral)}

  main{flex:1; overflow-y:auto; display:flex; flex-direction:column; min-height:0}
  .panel{display:none; flex:1; min-height:0; flex-direction:column; overflow-y:auto; padding:18px}
  .panel.active{display:flex}

  /* Chat */
  #chatLog{flex:1; display:flex; flex-direction:column; gap:12px}
  .msg{max-width:82%; padding:10px 14px; border-radius:14px; line-height:1.45; font-size:.95rem; white-space:pre-wrap}
  .msg.bot{align-self:flex-start; background:var(--panel); border:1px solid var(--border); border-top-left-radius:3px}
  .msg.user{align-self:flex-end; background:var(--yellow); color:#20261b; border-top-right-radius:3px}
  .msg.err{align-self:center; color:#e79b9b; font-size:.85rem; font-style:italic}

  footer{
    display:flex; gap:8px; padding:12px 14px calc(env(safe-area-inset-bottom,0px) + 12px);
    border-top:1px dashed var(--border); background:var(--bg-2);
  }
  #mic, #send{
    border:1px solid var(--border); background:var(--panel); color:var(--chalk);
    width:44px; height:44px; border-radius:50%; flex-shrink:0; cursor:pointer; font-size:1.15rem;
  }
  #mic.listening{background:var(--yellow); color:#17322b; border-color:var(--yellow)}
  #send{background:var(--yellow); color:#17322b; font-weight:700}
  #textInput{
    flex:1; background:var(--panel); border:1px solid var(--border); color:var(--chalk);
    border-radius:22px; padding:0 16px; font-family:inherit; font-size:.95rem;
  }

  /* shared form bits */
  .box{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:14px}
  .box h2{font-family:'Kalam',cursive; margin:0 0 8px; font-size:1.15rem}
  .box p.hint{color:var(--chalk-dim); font-size:.82rem; margin:4px 0 10px}
  textarea, .box input[type="text"], select{
    width:100%; background:var(--bg-2); border:1px solid var(--border); color:var(--chalk);
    border-radius:8px; padding:8px 10px; font-family:'JetBrains Mono',monospace; font-size:.85rem;
  }
  select{font-family:'Inter',sans-serif}
  .actionBtn{
    border:none; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer;
    font-family:'Inter',sans-serif; margin-top:10px;
  }
  #plotBtn{background:var(--blue); color:#0d2b34}
  #newTaskBtn, #checkAnswerBtn{background:var(--coral); color:#3a180c}
  #taskArea{margin-top:10px}
  #taskText{font-size:.92rem; line-height:1.5}
  #taskFeedback{margin-top:10px; font-size:.92rem; line-height:1.5; white-space:pre-wrap}
  svg#chartSvg{width:100%; height:auto; background:var(--bg-2); border-radius:8px}

  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{outline:2px solid var(--blue)}
  .katex{color:inherit; font-size:1.05em}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
</head>
<body>

<header>
  <div>
    <h1>Herr Hungers kleiner Helfer</h1>
    <div class="sub">dein Physik-Tutor</div>
  </div>
  <button class="gear" id="gearBtn" aria-label="Einstellungen" title="Einstellungen">⚙</button>
</header>

<div id="avatarStage">
  <div id="avatar3d"></div>
</div>

<div id="settings">
  <label for="apiKey">Gemini API-Key</label>
  <input id="apiKey" type="password" placeholder="AIza..." autocomplete="off">
  <button id="saveKey">Speichern</button>
  <p id="settingsHint">Dein Key bleibt nur in diesem Browser gespeichert. Einen kostenlosen Key gibt's in Google AI Studio.</p>
</div>

<nav>
  <button class="active" data-tab="chat">💬 Chat</button>
  <button data-tab="diagram">📊 Diagramm</button>
  <button data-tab="task">📝 Aufgabe</button>
</nav>

<main>
  <section class="panel active" id="panel-chat">
    <div id="chatLog"></div>
  </section>

  <section class="panel" id="panel-diagram">
    <div class="box">
      <h2>Messdaten plotten</h2>
      <p class="hint">Ein Wertepaar pro Zeile, x und y durch Komma getrennt. Beispiel für einen freien Fall:<br>0,0<br>0.2,0.2<br>0.4,0.78<br>0.6,1.76</p>
      <textarea id="dataInput" rows="6" placeholder="0,0
0.2,0.2
0.4,0.78"></textarea>
      <input type="text" id="chartLabel" placeholder="Achsentitel, z. B. Zeit (s) / Strecke (m)" style="margin-top:8px">
      <button class="actionBtn" id="plotBtn">Diagramm
